[project]
name = "inteligentny-asystent-urzednika"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Michał Bąk", email = "michalbak000@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.118",
    "httpx>=0.28",
    "pdfplumber>=0.11",
    "python-dotenv>=1.1",
    "uvicorn>=0.37",
]

[project.scripts]
inteligentny-asystent-urzednika = "inteligentny_asystent_urzednika:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4",
]
