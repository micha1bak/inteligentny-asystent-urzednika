<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asystent urzędnika</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; color: #1a1a1a; background: #fff; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { border-bottom: 1px solid #ddd; padding: .4rem .6rem; text-align: left; }
    tr.pilny { background: #ffe3e0; }
  </style>
</head>
<body>
  <h1>Inteligentny asystent urzędnika</h1>
  <p>Tymczasowy podgląd – właściwy interfejs powstaje w issue [2.3]. API: <a href="/docs">/docs</a></p>
  <table>
    <thead><tr><th>Lp.</th><th>Nr wniosku</th><th>Temat</th><th>Wpływ</th><th>Termin</th><th>Dni</th><th>Status</th></tr></thead>
    <tbody id="wnioski"></tbody>
  </table>
  <script>
    fetch("/api/wnioski").then(r => r.json()).then(lista => {
      const tbody = document.getElementById("wnioski");
      for (const w of lista) {
        const tr = document.createElement("tr");
        if (w.pilny) tr.className = "pilny";
        for (const v of [w.lp, w.numer, w.temat, w.data_wplywu, w.termin_odpowiedzi, w.dni_do_terminu, w.status]) {
          const td = document.createElement("td");
          td.textContent = v;
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      }
    });
  </script>
</body>
</html>
